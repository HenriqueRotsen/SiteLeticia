name: Supabase keep-alive

# Backup diário do ping no Supabase (além do Vercel Cron).
# Evita pausa por inatividade no plano gratuito.
on:
  schedule:
    # 09:00 BRT (12:00 UTC)
    - cron: "0 12 * * *"
    # 21:00 BRT (00:00 UTC)
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Touch Supabase via keep-alive endpoint
        env:
          KEEP_ALIVE_URL: ${{ secrets.KEEP_ALIVE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${KEEP_ALIVE_URL:-}" ]; then
            echo "::warning::Secret KEEP_ALIVE_URL não configurado. Pulando keep-alive."
            echo "Configure em Settings → Secrets: https://seu-dominio.com/api/keep-alive"
            exit 0
          fi

          AUTH_HEADER=()
          if [ -n "${CRON_SECRET:-}" ]; then
            AUTH_HEADER=(-H "Authorization: Bearer ${CRON_SECRET}")
          fi

          # Use o domínio de produção (ex.: https://www.leticiavrcunha.com.br/api/keep-alive).
          # URLs *.vercel.app de deploys antigos retornam DEPLOYMENT_NOT_FOUND (404).
          echo "Calling ${KEEP_ALIVE_URL}"
          HTTP_CODE=$(curl -sS -L -o /tmp/keep-alive-body.json -w "%{http_code}" \
            --max-time 45 \
            -X GET \
            "${AUTH_HEADER[@]}" \
            "$KEEP_ALIVE_URL")

          echo "HTTP ${HTTP_CODE}"
          cat /tmp/keep-alive-body.json || true
          echo

          if [ "$HTTP_CODE" = "404" ]; then
            echo "::error::KEEP_ALIVE_URL aponta para um deploy inexistente. Atualize o secret para https://www.leticiavrcunha.com.br/api/keep-alive"
            exit 1
          fi

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Keep-alive falhou com status ${HTTP_CODE}"
            exit 1
          fi

          echo "Keep-alive OK"
