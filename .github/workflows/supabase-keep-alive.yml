name: Supabase keep-alive

# Backup diário do ping no Supabase (além do Vercel Cron).
# Evita pausa por inatividade no plano gratuito.
on:
  schedule:
    # 09:00 BRT (12:00 UTC)
    - cron: "0 12 * * *"
    # 21:00 BRT (00:00 UTC)
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Touch Supabase via keep-alive endpoint
        env:
          KEEP_ALIVE_URL: ${{ secrets.KEEP_ALIVE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${KEEP_ALIVE_URL:-}" ]; then
            echo "Configure o secret KEEP_ALIVE_URL (ex.: https://seu-dominio.com/api/keep-alive)"
            exit 1
          fi

          AUTH_HEADER=()
          if [ -n "${CRON_SECRET:-}" ]; then
            AUTH_HEADER=(-H "Authorization: Bearer ${CRON_SECRET}")
          fi

          echo "Calling ${KEEP_ALIVE_URL}"
          HTTP_CODE=$(curl -sS -o /tmp/keep-alive-body.json -w "%{http_code}" \
            --max-time 30 \
            -X GET \
            "${AUTH_HEADER[@]}" \
            "$KEEP_ALIVE_URL")

          echo "HTTP ${HTTP_CODE}"
          cat /tmp/keep-alive-body.json || true
          echo

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Keep-alive falhou com status ${HTTP_CODE}"
            exit 1
          fi
