name: Ata do Meet no prontuário (experimental)

# Copie para .github/workflows/ quando GOOGLE_MEET_NOTES_ENABLED=true estiver ligado.
# Roda a cada 30 minutos; a rota procura a ata das consultas encerradas há 15 min a 3 dias.
# Secrets em Settings > Secrets and variables > Actions:
#   SITE_URL     ex.: https://seu-site.com.br
#   CRON_SECRET  o mesmo valor da variável CRON_SECRET do servidor
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar a rota de importação
        run: |
          curl -fsS --max-time 60 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/cron/meet-notes"
